name: Helm Tests

on:
  pull_request:
    paths:
      - "charts/featbit/**"
      - "tests/helm/**"
      - ".github/workflows/helm-tests.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Add Helm repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add groundhog2k https://groundhog2k.github.io/helm-charts/

      - name: Build chart dependencies
        run: helm dependency build charts/featbit

      - name: Lint chart
        run: helm lint charts/featbit

      - name: Test PostgreSQL password rendering
        run: bash tests/helm/postgresql-password-env.sh
