name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          
      - name: Add helm repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add groundhog2k https://groundhog2k.github.io/helm-charts/

      - name: Build chart dependencies
        run: helm dependency build charts/featbit

      - name: Lint chart
        run: helm lint charts/featbit

      - name: Test PostgreSQL password rendering
        run: bash tests/helm/postgresql-password-env.sh

      - name: Test ClickHouse secret name rendering
        run: bash tests/helm/clickhouse-secret-name.sh

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
