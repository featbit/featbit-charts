# Optional: sync FeatBit's Secrets from Azure Key Vault (Secrets Store CSI driver).
#
# Prerequisites:
# - AKS with the Azure Key Vault provider for Secrets Store CSI Driver add-on enabled
#   (az aks enable-addons --addons azure-keyvault-secrets-provider ...).
# - A Key Vault holding the three secrets listed under "objects" below.
# - The managed identity below has permission to read secrets in that Key Vault.
#
# Apply it in the namespace where FeatBit is installed:
#   kubectl apply -n <install-namespace> -f keyvault-secret-provider.yaml
# Then uncomment the volumeMounts/volumes block for api (and els) in values.yaml.
# The Kubernetes Secrets are created only once a pod mounts the volume.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  # Must match volumes[].csi.volumeAttributes.secretProviderClass in values.yaml.
  name: featbit-keyvault-secrets
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    # Client ID of the identity that reads Key Vault, for example the add-on identity
    # (az aks show ... --query addonProfiles.azureKeyvaultSecretsProvider.identity.clientId).
    userAssignedIdentityID: "<identity-client-id>"
    tenantId: "<tenant-id>"
    keyvaultName: "<keyvault-name>"
    # Secret names in Key Vault (objectName) and the local aliases used below.
    objects: |
      array:
        - |
          objectName: featbit-postgres-password
          objectType: secret
          objectAlias: postgres-password
        - |
          objectName: featbit-redis-password
          objectType: secret
          objectAlias: redis-password
        - |
          objectName: featbit-jwt-key
          objectType: secret
          objectAlias: jwt-key
  # Kubernetes Secrets created from the Key Vault values. Names and keys match values.yaml.
  secretObjects:
    - secretName: featbit-postgres-secret
      type: Opaque
      data:
        - objectName: postgres-password
          key: password
    - secretName: featbit-redis-secret
      type: Opaque
      data:
        - objectName: redis-password
          key: password
    - secretName: featbit-jwt-key-secret
      type: Opaque
      data:
        - objectName: jwt-key
          key: jwt-key
