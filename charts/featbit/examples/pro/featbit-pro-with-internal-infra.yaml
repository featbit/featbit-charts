# example of featbit pro configuration in exposing services via load balancer(auto discovery ips)
evaluationServerExternalUrl: ""
autoDiscovery: true

architecture:
  tier: "professional"
  database: "postgresql"

ui:
  service:
    type: LoadBalancer
    port: 80


api:
  # Fixed development key for local use only. Use a Kubernetes Secret in production.
  env:
    - name: Jwt__Algorithm
      value: "HS256"
    - name: Jwt__Key
      value: "local-development-only-jwt-key-change-before-production"
  service:
    type: LoadBalancer
    port: 80

els:
  service:
    type: LoadBalancer
    port: 80

kafka:
  enabled: true
clickhouse:
  enabled: true
