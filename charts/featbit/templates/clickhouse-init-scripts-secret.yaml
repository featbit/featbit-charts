{{- if (include "featbit.clickhouse.managedInitdbSecret" .) -}}
{{- $managed := include "featbit.isPro" . -}}
{{- $scripts := .Values.clickhouse.initdbScripts | default dict -}}
{{- if and $managed (hasKey $scripts "20_featbit-v6.sh") -}}
{{- fail "clickhouse.initdbScripts key 20_featbit-v6.sh is reserved for FeatBit; use another ordered filename or take ownership through initdbScriptsSecret." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ printf "%s-featbit-initdb" (include "featbit.clickhouse.fullname" .) | quote }}
  labels:
    {{- include "featbit-metadata-labels-common" . | nindent 4 }}
  annotations:
    {{- include "featbit-metadata-annotations-common" . | nindent 4 }}
type: Opaque
{{- if or $managed $scripts }}
stringData:
  {{- if $managed }}
  20_featbit-v6.sh: |-
    {{- include "featbit.clickhouse.initdbScript" . | nindent 4 }}
  {{- end }}
  {{- if $scripts }}
  {{- include "common.tplvalues.render" (dict "value" $scripts "context" .Subcharts.clickhouse) | nindent 2 }}
  {{- end }}
{{- else }}
stringData: {}
{{- end }}
{{- end -}}
