# Prepare this template locally. Apply only the generated manifest after review.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: els-readiness-probe
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: els-readiness-probe
    app.kubernetes.io/instance: els-readiness-probe
spec:
  replicas: 1
  # Avoid two simultaneous sampler instances during a manual image update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: els-readiness-probe
      app.kubernetes.io/instance: els-readiness-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: els-readiness-probe
        app.kubernetes.io/instance: els-readiness-probe
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["--urls", "http://0.0.0.0:5080"]
          ports:
            - name: http
              containerPort: 5080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
__ENVIRONMENT__
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Background mode checks the process; kubelet mode checks dependencies.
          readinessProbe:
            httpGet:
              path: __READINESS_PATH__
              port: http
            periodSeconds: __READINESS_PERIOD__
            timeoutSeconds: __READINESS_TIMEOUT__
            failureThreshold: 3
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
